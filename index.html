<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090711">
<link rel="icon" type="image/png" href="/logo.png">
<title>Lumia AI</title>

<style>
:root {
  --bg:#090711;
  --panel:#100e1b;
  --border:rgba(255,255,255,.09);
  --purple:#a477ff;
  --text:#f5f1ff;
  --muted:#9690aa;
}

* { box-sizing:border-box; }

body {
  margin:0;
  height:100vh;
  overflow:hidden;
  background:radial-gradient(ellipse at 50% -20%,#382064,transparent 55%),var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,textarea { font:inherit; }
button { cursor:pointer; }

.app { display:flex;width:100%;height:100%; }

.sidebar {
  width:270px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  padding:22px 16px;
  background:rgba(12,10,21,.9);
  border-right:1px solid var(--border);
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:30px;
  padding:0 7px;
}

.brand img { width:43px;height:43px;object-fit:contain; }
.brand-name { font-size:21px;font-weight:750;letter-spacing:-.8px; }
.brand-name span { color:var(--purple); }

.new-chat {
  width:100%;
  padding:13px;
  border:1px solid #50386f;
  border-radius:13px;
  background:linear-gradient(120deg,#39245c,#211637);
  color:white;
  text-align:left;
}

.new-chat:hover { border-color:var(--purple); }

.section-label {
  margin:27px 9px 12px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
}

.history { flex:1;overflow-y:auto; }

.history-item {
  display:flex;
  align-items:center;
  gap:6px;
  width:100%;
  padding:11px;
  margin-bottom:5px;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  color:#c9c2d9;
  text-align:left;
}

.history-item.active,
.history-item:hover {
  background:rgba(255,255,255,.055);
  border-color:var(--border);
  color:white;
}

.history-title {
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.history-delete {
  border:0;
  background:transparent;
  color:var(--muted);
  padding:3px 5px;
}

.history-delete:hover { color:#ff8585; }

.sidebar-footer {
  padding:15px 8px 0;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
}

.dot {
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:7px;
  border-radius:50%;
  background:#a477ff;
  box-shadow:0 0 10px #a477ff;
}

.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar {
  height:75px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  border-bottom:1px solid var(--border);
  background:rgba(9,7,17,.35);
  backdrop-filter:blur(20px);
}

.model-label {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
}

.model-icon {
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border:1px solid #503b76;
  border-radius:11px;
  background:#211633;
  color:#c7aaff;
}

.top-tag {
  padding:7px 11px;
  border:1px solid var(--border);
  border-radius:20px;
  color:#b7a6d8;
  font-size:11px;
}

.chat {
  flex:1;
  min-height:0;
  overflow-y:auto;
  scroll-behavior:smooth;
}

.welcome {
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 20px 45px;
  text-align:center;
}

.hero-logo {
  width:115px;
  height:115px;
  object-fit:contain;
  filter:drop-shadow(0 0 28px #7d46ff55);
  animation:float 5s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-8px); }
}

.welcome h1 {
  margin:20px 0 10px;
  font-size:clamp(32px,5vw,49px);
  letter-spacing:-2px;
}

.gradient {
  background:linear-gradient(100deg,#d6c0ff,#9c70ff,#64d9ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.welcome p {
  max-width:440px;
  margin:0;
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}

.suggestions {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  width:min(560px,100%);
  margin-top:30px;
}

.suggestion {
  min-height:83px;
  padding:15px;
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(255,255,255,.025);
  color:white;
  text-align:left;
  transition:.2s;
}

.suggestion:hover {
  background:#a477ff18;
  border-color:#7250a9;
  transform:translateY(-2px);
}

.suggestion strong {
  display:block;
  margin-bottom:7px;
  font-size:12px;
}

.suggestion small { color:var(--muted);font-size:11px; }

.messages {
  width:min(800px,100%);
  margin:0 auto;
  padding:30px 25px;
}

.message {
  display:flex;
  gap:13px;
  margin-bottom:25px;
  animation:appear .25s ease;
}

@keyframes appear {
  from { opacity:0;transform:translateY(7px); }
  to { opacity:1;transform:translateY(0); }
}

.avatar {
  width:34px;
  height:34px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:1px solid var(--border);
  border-radius:11px;
  background:#211633;
  font-size:12px;
}

.message.user .avatar { background:#29223a; }

.message-body {
  min-width:0;
  padding-top:3px;
  line-height:1.75;
  font-size:14px;
  overflow-wrap:anywhere;
}

.message-name {
  margin-bottom:5px;
  font-size:12px;
  font-weight:700;
  color:#c7b1ff;
}

.message.user .message-name { color:#d7d0e8; }

.message-text { white-space:pre-wrap; }
.message.error .message-text { color:#ffaaaa; }

.typing {
  color:var(--muted);
  animation:pulse 1.2s infinite;
}

@keyframes pulse {
  50% { opacity:.4; }
}

/* Logo Lumia durante l'elaborazione */
.thinking-avatar {
  overflow:visible;
  background:transparent;
  border:0;
}

.thinking-logo {
  display:block;
  width:34px;
  height:34px;
  object-fit:contain;
  filter:drop-shadow(0 0 9px #a477ff88);
  animation:lumia-thinking 1.2s ease-in-out infinite;
}

@keyframes lumia-thinking {
  0%,100% {
    transform:translateY(0);
  }
  50% {
    transform:translateY(-7px);
  }
}

.composer-area {
  flex-shrink:0;
  padding:12px 24px 20px;
  background:linear-gradient(transparent,var(--bg) 25%);
}

.composer {
  width:min(800px,100%);
  margin:0 auto;
  padding:12px 12px 10px 17px;
  border:1px solid #a477ff45;
  border-radius:19px;
  background:rgba(22,18,34,.95);
  transition:border-color .2s;
}

.composer:focus-within { border-color:#a477ffb0; }

textarea {
  display:block;
  width:100%;
  max-height:150px;
  min-height:35px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:white;
  line-height:1.6;
  font-size:14px;
}

textarea::placeholder { color:#777086; }

.composer-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:8px;
  gap:10px;
}

.composer-hint { color:#777086;font-size:10px; }

.send {
  display:grid;
  place-items:center;
  width:37px;
  height:37px;
  flex-shrink:0;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#b18aff,#8051e8);
  color:white;
  font-size:19px;
}

.send:disabled { opacity:.5;cursor:wait; }

.disclaimer {
  margin-top:10px;
  color:#716b80;
  font-size:10px;
  text-align:center;
}

.mobile-menu {
  display:none;
  border:0;
  background:transparent;
  color:white;
  font-size:22px;
}

@media(max-width:700px) {
  .sidebar {
    position:fixed;
    z-index:10;
    inset:0 auto 0 0;
    width:270px;
    transform:translateX(-100%);
    transition:transform .25s;
  }

  .sidebar.open { transform:translateX(0); }
  .mobile-menu { display:block; }
  .topbar { height:65px;padding:0 16px; }
  .top-tag { display:none; }
  .welcome { padding:25px 18px; }
  .hero-logo { width:88px;height:88px; }
  .welcome h1 { letter-spacing:-1px; }
  .suggestions { grid-template-columns:1fr;margin-top:23px; }
  .suggestion { min-height:68px; }
  .messages { padding:22px 16px; }
  .composer-area { padding:10px 12px 14px; }
}
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/logo.png" alt="Lumia AI">
      <div class="brand-name">Lumia <span>AI</span></div>
    </div>

    <button class="new-chat" id="newChat">＋ &nbsp; Nuova conversazione</button>
